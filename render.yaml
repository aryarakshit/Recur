services:
  - type: web
    name: recur-discord-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: FALLBACK_PROVIDER
        value: ""
      - key: FALLBACK_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
      - key: MAINTAINER_MENTION
        value: "@Core Member or @Volunteer"
      - key: BOT_ACTIVITY
        value: "hackathon questions | help desk"
      - key: MAINTAINER_ROLE_ID
        sync: false
      - key: ALLOWED_CHANNELS
        value: "general,ask-mentors,ask-mentor,help,recur-mem-update,chat,general-chat,discussion,lounge,welcome,introductions"
      - key: ALLOWED_ROLES
        value: "hacker,hackers,participant,participants"
      - key: EXCLUDED_ROLES
        value: "admin,administrator,moderator,mod,core member,core mem,volunteer,judge,bot,dyno"
      - key: MODERATOR_MODE
        value: "true"
      - key: TEAM_FINDING_CHANNELS
        value: "find-your-team,find-your-team!"

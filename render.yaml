services:
  - type: web
    name: recur-discord-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: GEMINI_API_KEY
        sync: false
      - key: MAINTAINER_MENTION
        value: "@Core Member or @Volunteer"
      - key: MAINTAINER_ROLE_ID
        sync: false
      - key: ALLOWED_CHANNELS
        value: "general,ask-mentors"
      - key: ALLOWED_ROLES
        value: "admin,administrator,hacker,hackers,participant,participants"
      - key: EXCLUDED_ROLES
        value: "core member,core mem,volunteer,judge,bot,dyno"
